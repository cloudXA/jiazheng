services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-domestic_risk}
      MYSQL_USER: ${MYSQL_USER:-example}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - domestic-risk-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-example}:${MYSQL_PASSWORD:-example}@mysql:3306/${MYSQL_DATABASE:-domestic_risk}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  domestic-risk-mysql:
